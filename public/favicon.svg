<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
      .obscura-text { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 28px; fill: white; }
    </style>
    <radialGradient id="glowGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#9F95FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C6FF0;stop-opacity:0.3" />
    </radialGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B7B0FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#7C6FF0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5B4FD8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#06050D"/>
  
  <!-- Glow effect -->
  <circle cx="100" cy="80" r="60" fill="url(#glowGrad)" opacity="0.4"/>
  
  <!-- Central shape: stylized lock/shield with wave -->
  <g transform="translate(100, 80)">
    <!-- Outer ring -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="url(#purpleGrad)" stroke-width="3" opacity="0.8"/>
    
    <!-- Inner wave curve -->
    <path d="M -20,-35 Q -10,-20 0,-25 Q 10,-30 20,-20" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Lock shackle -->
    <path d="M -15,0 A 15,15 0 0,1 15,0" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5" stroke-linecap="round"/>
    
    <!-- Lock body -->
    <rect x="-12" y="5" width="24" height="20" rx="3" fill="none" stroke="url(#purpleGrad)" stroke-width="2.5"/>
    
    <!-- Keyhole -->
    <circle cx="0" cy="12" r="3" fill="url(#purpleGrad)" opacity="0.7"/>
  </g>
  
  <!-- Accent: small triangle (confidential mark) -->
  <path d="M 150,40 L 160,50 L 155,60 Z" fill="url(#purpleGrad)" opacity="0.9"/>
</svg>
